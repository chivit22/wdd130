<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Water Rafting Company | Contact Us</title>
  <meta name="description" content="Contact White Water Rafting Company to ask questions, plan a rafting trip, or reserve your next adventure.">
  <meta name="author" content="WDD 130 Student">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <div class="site-frame">
    <header class="top-band">
      <div class="logo-box">
        <img class="brand-logo" src="images/logo.png" alt="Exciting Expeditions logo">
      </div>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html" class="active">Contact Us</a>
      </nav>
    </header>

    <main class="page-main contact-page">
      <section class="contact-panel wireframe-contact">
        <div class="company-info">
          <h1>White Water Rafting Company</h1>
          <p>123 Main River Street</p>
          <p>Kobol, California</p>
          <p>+1 999 999 9999</p>
          <p>info@whitewater.com</p>
        </div>

        <div class="contact-content">
          <div class="map-placeholder">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15901.245583805803!2d6.959504820305218!3d4.887428561589022!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1794675197045!5m2!1sen!2sng" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
          </div>

          <form class="contact-form" action="#" method="post">
            <div class="field-row">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="Placeholder">
            </div>

            <div class="field-row">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="Placeholder">
            </div>

            <div class="field-row radio-group">
              <label>Message Purpose</label>
              <div class="radio-options">
                <label class="radio-option"><input type="radio" id="purpose-general" name="purpose" checked> General Inquiry</label>
                <label class="radio-option"><input type="radio" id="purpose-reservation" name="purpose"> Reservation Question</label>
                <label class="radio-option"><input type="radio" id="purpose-website" name="purpose"> Website Suggestion</label>
              </div>
            </div>

            <div class="field-row">
              <label for="message">Message</label>
              <textarea id="message" name="message" placeholder="Type here"></textarea>
            </div>

            <div class="checkbox-row">
              <label class="checkbox-option" for="newsletter">
                <input type="checkbox" id="newsletter" name="subscribe"> Please subscribe me to the monthly newsletter
              </label>
            </div>

            <button type="submit">Get in Touch!</button>
          </form>
        </div>

        <div class="team-panel">
          <h2>We Are Here to Serve You</h2>

          <div class="employee-grid">
            <div class="employee-card">
              <div class="employee-icon"></div>
              <span>Employee Profile</span>
              <img src="images/hi.jpg" alt=" Employee Profile">
            </div>
            <div class="employee-card">
              <div class="employee-icon"></div>
              <span>Employee Profile</span>
              <img src="images/hi.jpg" alt=" Employee Profile">
            </div>
            <div class="employee-card">
              <div class="employee-icon"></div>
              <span>Employee Profile</span>
              <img src="images/my.jpg" alt=" Employee Profile">
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer contact-footer">
      <p>© 2026 White Water Rafting Company | Student: Your Name</p>
      <nav class="socialmedia" aria-label="Social media links">
        <a href="#" aria-label="Facebook"><img src="images/facebook.png" alt="Facebook" width="24" height="24"></a>
        <a href="#" aria-label="LinkedIn"><img src="images/linkedin.png" alt="LinkedIn" width="24" height="24"></a>
        <a href="#" aria-label="Instagram"><img src="images/instagram.png" alt="Instagram" width="24" height="24"></a>
      </nav>
    </footer>
  </div>
</body>

</html>
